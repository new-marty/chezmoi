# Machine profiles.
#
# A machine picks one in its own ~/.config/chezmoi/chezmoi.toml:
#
#   [data]
#       profile = "work"
#
# Templates read it as `dig "profile" "full" .`, so a machine without the key
# gets "full". .chezmoiignore stops the apply when the value is not listed
# here. Unlike the opt-in switches, a profile changes how the core is set up
# (zsh, editor settings), not whether an application's settings are applied.
#
#   full  zsh plugins come from sheldon (~/.config/sheldon/plugins.toml).
#   work  for a Mac whose allow-list has Oh My Zsh but not sheldon, Nerd Fonts
#         or editor extensions: zsh plugins come from Oh My Zsh with the
#         plugins vendored in dot_zsh/omz-custom, and the VS Code and Cursor
#         settings colour the built-in theme instead of using an extension.
#         See docs/en/work-mac.md.
profiles = ["full", "work"]
