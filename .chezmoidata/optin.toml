# Opt-in switches for application settings.
#
# The core (zsh, git, ssh, editorconfig) is always applied. Everything listed
# here is applied only on machines that select it in their own
# ~/.config/chezmoi/chezmoi.toml:
#
#   [data]
#       optin = ["vscode", "ghostty"]
#
# Each switch has up to three lists, all relative to the home directory:
#
#   files    the files chezmoi writes for the switch. These are the only paths
#            `just optin` reports, and the only ones it is safe to delete after
#            opting out, because chezmoi wrote them.
#   dirs     directories chezmoi creates only for this switch. Ignoring them
#            keeps an unselected switch from leaving empty directories behind.
#            They can hold the application's own data (Library/Application
#            Support/Code is all of VS Code's state), so they are never offered
#            for deletion.
#   scripts  run_ scripts, by the target name chezmoi gives them
#            (run_once_before_install-tpm.sh.tmpl becomes install-tpm.sh).
#
# .chezmoiignore ignores every path of every switch that is not selected, and
# stops the apply when the selection names a switch that is not in this table.
# Ignoring a path only stops chezmoi from managing it; chezmoi never deletes
# anything. Run `just optin` to see each switch's state on this machine.
#
# Keep `files` in step with the source tree: `chezmoi managed` in a home where
# every switch is selected lists them. The table is named optin_paths rather
# than optin so that it cannot collide with the machine's own `optin` list.

[optin_paths.vscode]
files = [
    "Library/Application Support/Code/User/settings.json",
    "Library/Application Support/Code/User/keybindings.json",
    "Library/Application Support/Code/User/extensions.json",
]
dirs = ["Library/Application Support/Code"]

[optin_paths.cursor]
files = ["Library/Application Support/Cursor/User/settings.json"]
dirs = ["Library/Application Support/Cursor"]

[optin_paths.ghostty]
files = [
    ".config/ghostty/config",
    ".config/ghostty/themes/poimandres.ghostty",
]
dirs = [".config/ghostty"]

[optin_paths.tmux]
files = [
    ".config/tmux/tmux.conf",
    ".config/tmux/cheatsheet.md",
]
dirs = [".config/tmux"]
scripts = ["install-tpm.sh"]

[optin_paths.navi]
files = [".config/navi/cheats/cheats.cheat"]
dirs = [".config/navi"]

[optin_paths.mise]
files = [".config/mise/config.toml"]
dirs = [".config/mise"]

[optin_paths.justfile]
files = ["justfile"]

# ~/.config/karabiner becomes a symlink to karabiner/ in the source directory,
# because Karabiner-Elements rewrites karabiner.json itself and stops noticing
# changes when karabiner.json alone is a symlink.
[optin_paths.karabiner]
files = [".config/karabiner"]

# Oh My Zsh loads the zsh plugins instead of sheldon, for a Mac that has Oh My
# Zsh but not sheldon and cannot run git clone. Oh My Zsh itself is installed by
# hand from its zip into ~/.oh-my-zsh (docs/en/work-mac.md); chezmoi writes only
# the plugins it does not ship, vendored by scripts/vendor-omz-plugins.sh.
[optin_paths.omz]
files = [
    ".zsh/omz-custom/plugins/zsh-autosuggestions/LICENSE",
    ".zsh/omz-custom/plugins/zsh-autosuggestions/zsh-autosuggestions.plugin.zsh",
    ".zsh/omz-custom/plugins/zsh-autosuggestions/zsh-autosuggestions.zsh",
    ".zsh/omz-custom/plugins/zsh-history-substring-search/zsh-history-substring-search.plugin.zsh",
    ".zsh/omz-custom/plugins/zsh-history-substring-search/zsh-history-substring-search.zsh",
    ".zsh/omz-custom/plugins/zsh-syntax-highlighting/.revision-hash",
    ".zsh/omz-custom/plugins/zsh-syntax-highlighting/.version",
    ".zsh/omz-custom/plugins/zsh-syntax-highlighting/COPYING.md",
    ".zsh/omz-custom/plugins/zsh-syntax-highlighting/highlighters/brackets/brackets-highlighter.zsh",
    ".zsh/omz-custom/plugins/zsh-syntax-highlighting/highlighters/cursor/cursor-highlighter.zsh",
    ".zsh/omz-custom/plugins/zsh-syntax-highlighting/highlighters/line/line-highlighter.zsh",
    ".zsh/omz-custom/plugins/zsh-syntax-highlighting/highlighters/main/main-highlighter.zsh",
    ".zsh/omz-custom/plugins/zsh-syntax-highlighting/highlighters/pattern/pattern-highlighter.zsh",
    ".zsh/omz-custom/plugins/zsh-syntax-highlighting/highlighters/regexp/regexp-highlighter.zsh",
    ".zsh/omz-custom/plugins/zsh-syntax-highlighting/highlighters/root/root-highlighter.zsh",
    ".zsh/omz-custom/plugins/zsh-syntax-highlighting/zsh-syntax-highlighting.plugin.zsh",
    ".zsh/omz-custom/plugins/zsh-syntax-highlighting/zsh-syntax-highlighting.zsh",
]
dirs = [".zsh/omz-custom"]

# How the VS Code and Cursor settings look. These switches write no files of
# their own; they change what the vscode and cursor switches write, so one of
# them is required with those (see optin_choices below).
#   editor-extensions  the Poimandres and catppuccin extensions, Hack Nerd Font
#   editor-builtin     the built-in Default Dark Modern theme recoloured with
#                      the Poimandres colours, system fonts; for a Mac that
#                      cannot install extensions or fonts
[optin_paths.editor-extensions]
[optin_paths.editor-builtin]

# Choices with no default. When a machine selects any switch in `required_by`,
# it must also select exactly one switch in `options`, or the apply stops. A
# machine that selects none of `required_by` needs none of `options`.
[optin_choices.editor-look]
description = "how the VS Code and Cursor settings look"
required_by = ["vscode", "cursor"]
options = ["editor-extensions", "editor-builtin"]
