name: Lint and Test

on:
  push:
    branches: [main]
    paths:
      - "dot_zsh/**"
      - "dot_zshrc"
      - "scripts/**"
      - "**.tmpl"
      - ".chezmoi*"
      - ".chezmoidata/**"
      - "create_*"
      - "justfile"
      - ".github/workflows/lint.yml"
  pull_request:
    branches: [main]
    paths:
      - "dot_zsh/**"
      - "dot_zshrc"
      - "scripts/**"
      - "**.tmpl"
      - ".chezmoi*"
      - ".chezmoidata/**"
      - "create_*"
      - "justfile"
      - ".github/workflows/lint.yml"
  workflow_dispatch:

jobs:
  lint:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh and ShellCheck
        run: sudo apt-get update && sudo apt-get install -y zsh shellcheck

      # ShellCheck does not support zsh (koalaman/shellcheck#809), so zsh files
      # get a syntax check only, as oh-my-zsh's CI does.
      - name: Check zsh syntax
        run: |
          for f in dot_zshrc dot_zsh/*.zsh dot_zsh/*.zsh-theme dot_zsh/tests/*.zsh; do
            zsh -n "$f"
          done

      - name: Run ShellCheck on bash and sh scripts
        run: shellcheck scripts/*.sh run_once_before_install-tpm.sh.tmpl

  test:
    name: Run Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zsh
        run: |
          # Zsh should be pre-installed on macOS runners
          zsh --version

      - name: Source commands and run fcat tests
        run: |
          cd "$GITHUB_WORKSPACE"
          echo "📋 Running fcat tests..."
          zsh -c '
            source ./dot_zsh/commands.zsh
            source ./dot_zsh/tests/fcat_test.zsh
            main
          '

  chezmoi-doctor:
    name: Chezmoi Doctor
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin

      - name: Run chezmoi doctor
        run: |
          echo "📋 Running chezmoi doctor..."
          chezmoi doctor || true

      - name: Validate chezmoi templates
        run: |
          echo "📋 Validating chezmoi templates..."
          # Initialize chezmoi with current repo
          chezmoi init --source="$GITHUB_WORKSPACE" --apply=false || true
          # Check for template errors
          chezmoi execute-template < /dev/null || true

  fresh-apply:
    name: Apply on a machine with no config
    runs-on: macos-latest
    env:
      SRC: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: Install chezmoi
        run: sh -c "$(curl -fsLS get.chezmoi.io)" -- -b /usr/local/bin

      - name: Read the opt-in table
        run: |
          # The switch names and paths come from .chezmoidata/optin.toml, so
          # adding a switch there is enough for the checks below to cover it.
          # optin-files.txt: the files each switch writes (must all appear when
          # selected). optin-paths.txt: those files plus the switch's own
          # directories (none may appear when nothing is selected). Scripts are
          # left out: these applies exclude them (they clone from the network).
          set -euo pipefail
          : > "$RUNNER_TEMP/empty.toml"
          chezmoi execute-template --config "$RUNNER_TEMP/empty.toml" --source "$SRC" \
            '{{ range $n, $sw := .optin_paths }}{{ range dig "files" list $sw }}{{ . }}{{ "\n" }}{{ end }}{{ end }}' \
            > "$RUNNER_TEMP/optin-files.txt"
          chezmoi execute-template --config "$RUNNER_TEMP/empty.toml" --source "$SRC" \
            '{{ range $n, $sw := .optin_paths }}{{ range dig "dirs" list $sw }}{{ . }}{{ "\n" }}{{ end }}{{ end }}' \
            > "$RUNNER_TEMP/optin-dirs.txt"
          cat "$RUNNER_TEMP/optin-files.txt" "$RUNNER_TEMP/optin-dirs.txt" > "$RUNNER_TEMP/optin-paths.txt"
          # Every switch, except that of each choice (optin_choices) only the
          # first option is selected: selecting two options stops the apply.
          names="$(chezmoi execute-template --config "$RUNNER_TEMP/empty.toml" --source "$SRC" \
            '{{ $skip := list }}{{ range .optin_choices }}{{ $skip = concat $skip (rest .options) }}{{ end }}{{ $n := list }}{{ range keys .optin_paths | sortAlpha }}{{ if not (has . $skip) }}{{ $n = append $n . }}{{ end }}{{ end }}{{ toJson $n }}')"
          printf '[data]\n    optin = %s\n' "$names" > "$RUNNER_TEMP/all.toml"
          printf '[data]\n    optin = ["vscode", "no-such-switch"]\n' > "$RUNNER_TEMP/unknown.toml"
          cat "$RUNNER_TEMP/optin-paths.txt" "$RUNNER_TEMP/all.toml"
          [ -s "$RUNNER_TEMP/optin-files.txt" ]

      - name: Empty config applies only the core
        run: |
          # Someone who clones this repository has no chezmoi.toml data and none
          # of the optional tools. chezmoi fails on a missing template key
          # (missingkey=error), so this catches any template that assumes data.
          set -euo pipefail
          home="$(mktemp -d)"
          chezmoi apply --config "$RUNNER_TEMP/empty.toml" \
            --source "$SRC" --destination "$home" --exclude=scripts \
            --persistent-state "$RUNNER_TEMP/empty.boltdb"
          fail=0
          for f in .zshenv .zprofile .zshrc .editorconfig .gitconfig .config/git/config .ssh/config; do
            [ -e "$home/$f" ] || { echo "::error::core file missing: ~/$f"; fail=1; }
          done
          while IFS= read -r p; do
            [ -e "$home/$p" ] && { echo "::error::not opted in but applied: ~/$p"; fail=1; }
          done < "$RUNNER_TEMP/optin-paths.txt"
          [ "$fail" = 0 ]
          HOME="$home" git config --get core.pager
          HOME="$home" zsh -i -c 'echo "interactive shell started"'

      - name: Every switch selected writes every mapped file
        run: |
          set -euo pipefail
          home="$(mktemp -d)"
          chezmoi apply --config "$RUNNER_TEMP/all.toml" \
            --source "$SRC" --destination "$home" --exclude=scripts \
            --persistent-state "$RUNNER_TEMP/all.boltdb"
          fail=0
          while IFS= read -r p; do
            [ -e "$home/$p" ] || { echo "::error::opted in but missing: ~/$p"; fail=1; }
          done < "$RUNNER_TEMP/optin-files.txt"
          # A file added under a switch's directory must also be added to its
          # `files` list, or `just optin` would not report it. Entries outside
          # every switch's directories (~/justfile, the ~/.config/karabiner
          # symlink) are covered by the existence check above instead.
          sed 's|$|/|' "$RUNNER_TEMP/optin-dirs.txt" > "$RUNNER_TEMP/optin-dir-prefixes.txt"
          chezmoi managed --config "$RUNNER_TEMP/all.toml" --source "$SRC" \
            --destination "$home" --include=files \
            | grep -F -f "$RUNNER_TEMP/optin-dir-prefixes.txt" \
            | sort > "$RUNNER_TEMP/managed-in-dirs.txt"
          if ! grep -F -f "$RUNNER_TEMP/optin-dir-prefixes.txt" "$RUNNER_TEMP/optin-files.txt" \
              | sort | diff - "$RUNNER_TEMP/managed-in-dirs.txt"; then
            echo "::error::.chezmoidata/optin.toml files lists differ from what chezmoi manages"
            fail=1
          fi
          [ "$fail" = 0 ]
          HOME="$home" zsh -i -c 'echo "interactive shell started"'

      - name: The omz opt-in loads Oh My Zsh with the vendored plugins
        run: |
          # It is for a Mac that installs Oh My Zsh from its zip and cannot
          # clone, so the plugins must come from the repository.
          set -euo pipefail
          home="$(mktemp -d)"
          printf '[data]\n    optin = ["omz"]\n' > "$RUNNER_TEMP/omz.toml"
          chezmoi apply --config "$RUNNER_TEMP/omz.toml" \
            --source "$SRC" --destination "$home" --exclude=scripts \
            --persistent-state "$RUNNER_TEMP/omz.boltdb"
          grep -qx "DOTFILES_OMZ=1" "$home/.zshenv"
          # Before Oh My Zsh is installed the shell still starts, without it.
          HOME="$home" zsh -i -c 'echo "interactive shell started"'
          # A fixed Oh My Zsh commit, so an upstream change does not turn this
          # red for unrelated commits. Move it forward from time to time.
          omz_commit=60c9a7a839b790cd905d0fd4419435124fd1bdc0
          curl -fsSL -o "$RUNNER_TEMP/omz.zip" "https://github.com/ohmyzsh/ohmyzsh/archive/$omz_commit.zip"
          unzip -q "$RUNNER_TEMP/omz.zip" -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/ohmyzsh-$omz_commit" "$home/.oh-my-zsh"
          HOME="$home" zsh -i -c '
            for p in $plugins; do print "plugin: $p"; done
            (( $+functions[_zsh_autosuggest_start] )) || { echo "zsh-autosuggestions not loaded"; exit 1; }
            (( $+functions[history-substring-search-up] )) || { echo "zsh-history-substring-search not loaded"; exit 1; }
            [[ -n $ZSH_HIGHLIGHT_VERSION ]] || { echo "zsh-syntax-highlighting not loaded"; exit 1; }
            (( $+functions[fcat] )) || { echo "~/.zsh/commands.zsh not loaded"; exit 1; }
          '

      - name: A choice must be made exactly once
        run: |
          # optin_choices have no default: selecting a switch that needs one
          # (vscode) without an option, or with two, stops the apply. Each
          # option alone applies.
          set -uo pipefail
          expect_fail() {
            printf '[data]\n    optin = %s\n' "$1" > "$RUNNER_TEMP/choice.toml"
            if chezmoi apply --config "$RUNNER_TEMP/choice.toml" --source "$SRC" \
                --destination "$(mktemp -d)" --exclude=scripts \
                --persistent-state "$RUNNER_TEMP/choice.boltdb" 2> "$RUNNER_TEMP/choice.err"; then
              echo "::error::apply succeeded with optin = $1"
              return 1
            fi
            cat "$RUNNER_TEMP/choice.err"
            grep -q "$2" "$RUNNER_TEMP/choice.err"
          }
          expect_fail '["vscode"]' 'there is no default' || exit 1
          expect_fail '["vscode", "editor-extensions", "editor-builtin"]' 'keep only one' || exit 1
          expect_fail '["editor-builtin"]' 'or remove it' || exit 1
          # Each option applies, and writes settings that VS Code and Cursor
          # can parse (JSON with comments and trailing commas).
          for option in editor-extensions editor-builtin; do
            home="$(mktemp -d)"
            printf '[data]\n    optin = ["vscode", "cursor", "%s"]\n' "$option" > "$RUNNER_TEMP/choice.toml"
            chezmoi apply --config "$RUNNER_TEMP/choice.toml" --source "$SRC" \
              --destination "$home" --exclude=scripts \
              --persistent-state "$RUNNER_TEMP/choice-$option.boltdb" || exit 1
            python3 - "$home/Library/Application Support/Code/User/settings.json" \
                "$home/Library/Application Support/Cursor/User/settings.json" <<'PY' || exit 1
          import json, re, sys
          for path in sys.argv[1:]:
              text = re.sub(r"^\s*//.*$", "", open(path).read(), flags=re.M)
              text = re.sub(r",(\s*[}\]])", r"\1", text)
              def no_duplicates(pairs):
                  keys = [k for k, _ in pairs]
                  dup = {k for k in keys if keys.count(k) > 1}
                  assert not dup, f"{path}: duplicate keys {dup}"
                  return dict(pairs)
              json.loads(text, object_pairs_hook=no_duplicates)
              print(f"{path}: valid")
          PY
          done

      - name: An unknown switch name stops the apply
        run: |
          set -uo pipefail
          home="$(mktemp -d)"
          if chezmoi apply --config "$RUNNER_TEMP/unknown.toml" \
              --source "$SRC" --destination "$home" --exclude=scripts \
              --persistent-state "$RUNNER_TEMP/unknown.boltdb" 2> "$RUNNER_TEMP/unknown.err"; then
            echo "::error::apply succeeded with an unknown opt-in name"
            exit 1
          fi
          cat "$RUNNER_TEMP/unknown.err"
          grep -q 'unknown opt-in "no-such-switch"' "$RUNNER_TEMP/unknown.err"
