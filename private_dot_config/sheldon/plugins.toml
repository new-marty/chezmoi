shell = "zsh"

[plugins.local-zsh]
local = "~/.zsh"
use = ["*.zsh", "*.zsh-theme"]

[templates]
defer = "{% for file in files %}zsh-defer source \"{{ file }}\"\n{% endfor %}"

[plugins.zsh-defer]
github = "romkatv/zsh-defer"

[plugins.zsh-syntax-highlighting]
github = "zsh-users/zsh-syntax-highlighting"
apply = ["defer"]

[plugins.autojump]
github = "wting/autojump"
dir = "bin"
apply = ["PATH", "source"]

[plugins.zsh-autosuggestions]
github = "zsh-users/zsh-autosuggestions"

[plugins.zsh-autopair]
github = "hlissner/zsh-autopair"

[plugins.zsh-history-substring-search]
github = "zsh-users/zsh-history-substring-search"

# fzf-tab - Use fzf for tab completion
[plugins.fzf-tab]
github = "Aloxaf/fzf-tab"

# Enhanced command suggestion and navigation
[plugins.zsh-you-should-use]
github = "MichaelAquilina/zsh-you-should-use"
apply = ["defer"]

# Note: ZSH_AUTOSUGGEST settings are configured in suggestions.zsh
# to avoid duplication and ensure they're set after the plugin loads

# fzf-tab configuration
[plugins.fzf-tab-config]
inline = '''
# Set fzf-tab options
zstyle ':fzf-tab:*' fzf-command fzf
zstyle ':fzf-tab:*' fzf-flags --height=50% --layout=reverse --border
zstyle ':fzf-tab:complete:cd:*' fzf-preview 'eza -1 --color=always $realpath'
zstyle ':fzf-tab:complete:ls:*' fzf-preview 'eza -1 --color=always $realpath'
zstyle ':fzf-tab:complete:*:*' fzf-preview 'bat --color=always --style=numbers --line-range=:100 $realpath 2>/dev/null || eza -1 --color=always $realpath 2>/dev/null || echo $realpath'
'''

# zsh-abbr - Fish-like abbreviations for zsh
# Abbreviations expand inline as you type (different from aliases)
# Usage: abbr add gco='git checkout'
[plugins.zsh-abbr]
github = "olets/zsh-abbr"
apply = ["defer"]

# Common abbreviations configuration
[plugins.zsh-abbr-config]
inline = '''
# Configure zsh-abbr
export ABBR_QUIET=1
export ABBR_AUTOLOAD=1
'''
