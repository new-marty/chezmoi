# =============================================================================
# tmux configuration
# =============================================================================

# --- Prefix: Ctrl+\ (backslash) ---
unbind C-b
set -g prefix 'C-\'
bind 'C-\' send-prefix

# --- Terminal (Ghostty) ---
set -g default-terminal "tmux-256color"
set -ag terminal-features ",xterm-256color:RGB"
set -ag terminal-features ",xterm-256color:extkeys"
set -g extended-keys on
set -g allow-passthrough on
set -g set-clipboard on

# --- General ---
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 100000
set -g escape-time 0
set -g focus-events on
set -g detach-on-destroy off

# --- Vi mode ---
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# =============================================================================
# Alt-based prefix-free bindings (most common actions, no prefix needed)
# =============================================================================

# Pane navigation
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Window switching
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Quick actions
bind -n M-n new-window -c "#{pane_current_path}"
bind -n M-z resize-pane -Z

# Floating scratch terminal (persistent session)
bind -n M-t display-popup -E -xC -yC -w 80% -h 80% -d "#{pane_current_path}" \
  "tmux new-session -A -s scratch"

# Popup cheatsheet
bind -n M-/ display-popup -w 80% -h 80% -E "cat ~/.config/tmux/cheatsheet.md | less -R"

# =============================================================================
# Status bars: catppuccin on top, hint bar on bottom (like zellij)
# =============================================================================

set -g status 2
set -g status-position bottom

# Hint bar styling (catppuccin mocha palette)
# Key = white on surface1 pill, Action = colored text
HINT_DEFAULT="#[align=centre,bg=default] #[bg=#45475a,fg=#cdd6f4] Opt+hjkl #[bg=default,fg=#94e2d5] PANES #[fg=#585b70]  #[bg=#45475a,fg=#cdd6f4] Opt+1-9 #[bg=default,fg=#94e2d5] WIN #[fg=#585b70]  #[bg=#45475a,fg=#cdd6f4] Opt+n #[bg=default,fg=#94e2d5] NEW #[fg=#585b70]  #[bg=#45475a,fg=#cdd6f4] Opt+z #[bg=default,fg=#94e2d5] ZOOM #[fg=#585b70]  #[bg=#45475a,fg=#cdd6f4] Opt+t #[bg=default,fg=#94e2d5] FLOAT #[fg=#585b70]  #[bg=#45475a,fg=#cdd6f4] Opt+/ #[bg=default,fg=#94e2d5] HELP #[fg=#585b70]  #[fg=#585b70]║#[fg=#585b70]  #[bg=#45475a,fg=#cdd6f4] Ctrl+\\\\ #[bg=default,fg=#a6e3a1] p #[fg=#585b70]PANE  #[bg=#45475a,fg=#cdd6f4] w #[bg=default,fg=#a6e3a1]WIN #[fg=#585b70]  #[bg=#45475a,fg=#cdd6f4] R #[bg=default,fg=#a6e3a1]RESIZE #[fg=#585b70]  #[bg=#45475a,fg=#cdd6f4] s #[bg=default,fg=#a6e3a1]SESSION "

HINT_PANE="#[align=centre,bg=default] #[bg=#f9e2af,fg=#1e1e2e,bold]  PANE  #[bg=default,fg=#cdd6f4,nobold] #[bg=#45475a] h/j/k/l #[bg=default,fg=#94e2d5] move  #[bg=#45475a,fg=#cdd6f4] d #[bg=default,fg=#94e2d5] vsplit  #[bg=#45475a,fg=#cdd6f4] D #[bg=default,fg=#94e2d5] hsplit  #[bg=#45475a,fg=#cdd6f4] x #[bg=default,fg=#94e2d5] close  #[bg=#45475a,fg=#cdd6f4] z #[bg=default,fg=#94e2d5] zoom  #[bg=#45475a,fg=#cdd6f4] Esc #[bg=default,fg=#f38ba8] back "

HINT_WINDOW="#[align=centre,bg=default] #[bg=#f9e2af,fg=#1e1e2e,bold]  WINDOW  #[bg=default,fg=#cdd6f4,nobold] #[bg=#45475a] n #[bg=default,fg=#94e2d5] new  #[bg=#45475a,fg=#cdd6f4] h/l #[bg=default,fg=#94e2d5] prev/next  #[bg=#45475a,fg=#cdd6f4] r #[bg=default,fg=#94e2d5] rename  #[bg=#45475a,fg=#cdd6f4] x #[bg=default,fg=#94e2d5] close  #[bg=#45475a,fg=#cdd6f4] 1-5 #[bg=default,fg=#94e2d5] goto  #[bg=#45475a,fg=#cdd6f4] Esc #[bg=default,fg=#f38ba8] back "

HINT_RESIZE="#[align=centre,bg=default] #[bg=#f9e2af,fg=#1e1e2e,bold]  RESIZE  #[bg=default,fg=#cdd6f4,nobold] #[bg=#45475a] h/j/k/l #[bg=default,fg=#94e2d5] resize  #[bg=#45475a,fg=#cdd6f4] H/J/K/L #[bg=default,fg=#94e2d5] big resize  #[bg=#45475a,fg=#cdd6f4] Esc #[bg=default,fg=#f38ba8] back "

HINT_SESSION="#[align=centre,bg=default] #[bg=#f9e2af,fg=#1e1e2e,bold]  SESSION  #[bg=default,fg=#cdd6f4,nobold] #[bg=#45475a] l #[bg=default,fg=#94e2d5] list  #[bg=#45475a,fg=#cdd6f4] n #[bg=default,fg=#94e2d5] new  #[bg=#45475a,fg=#cdd6f4] d #[bg=default,fg=#94e2d5] detach  #[bg=#45475a,fg=#cdd6f4] x #[bg=default,fg=#94e2d5] kill  #[bg=#45475a,fg=#cdd6f4] r #[bg=default,fg=#94e2d5] rename  #[bg=#45475a,fg=#cdd6f4] Esc #[bg=default,fg=#f38ba8] back "

set -g status-format[1] "$HINT_DEFAULT"

# =============================================================================
# Modal key tables (prefix enters mode, hint bar updates)
# =============================================================================

# --- Pane mode: prefix + p ---
bind p {
  set -g status-format[1] "$HINT_PANE"
  switch-client -T pane_mode
}
bind -T pane_mode h { select-pane -L ; set -g status-format[1] "$HINT_DEFAULT" }
bind -T pane_mode j { select-pane -D ; set -g status-format[1] "$HINT_DEFAULT" }
bind -T pane_mode k { select-pane -U ; set -g status-format[1] "$HINT_DEFAULT" }
bind -T pane_mode l { select-pane -R ; set -g status-format[1] "$HINT_DEFAULT" }
bind -T pane_mode d { split-window -h -c "#{pane_current_path}" ; set -g status-format[1] "$HINT_DEFAULT" }
bind -T pane_mode D { split-window -v -c "#{pane_current_path}" ; set -g status-format[1] "$HINT_DEFAULT" }
bind -T pane_mode x { kill-pane ; set -g status-format[1] "$HINT_DEFAULT" }
bind -T pane_mode z { resize-pane -Z ; set -g status-format[1] "$HINT_DEFAULT" }
bind -T pane_mode Escape { set -g status-format[1] "$HINT_DEFAULT" }

# --- Window mode: prefix + w ---
bind w {
  set -g status-format[1] "$HINT_WINDOW"
  switch-client -T window_mode
}
bind -T window_mode n { new-window -c "#{pane_current_path}" ; set -g status-format[1] "$HINT_DEFAULT" }
bind -T window_mode x { confirm-before kill-window ; set -g status-format[1] "$HINT_DEFAULT" }
bind -T window_mode r { command-prompt -I "#W" "rename-window '%%'" ; set -g status-format[1] "$HINT_DEFAULT" }
bind -T window_mode h { previous-window ; set -g status-format[1] "$HINT_DEFAULT" }
bind -T window_mode l { next-window ; set -g status-format[1] "$HINT_DEFAULT" }
bind -T window_mode 1 { select-window -t 1 ; set -g status-format[1] "$HINT_DEFAULT" }
bind -T window_mode 2 { select-window -t 2 ; set -g status-format[1] "$HINT_DEFAULT" }
bind -T window_mode 3 { select-window -t 3 ; set -g status-format[1] "$HINT_DEFAULT" }
bind -T window_mode 4 { select-window -t 4 ; set -g status-format[1] "$HINT_DEFAULT" }
bind -T window_mode 5 { select-window -t 5 ; set -g status-format[1] "$HINT_DEFAULT" }
bind -T window_mode Escape { set -g status-format[1] "$HINT_DEFAULT" }

# --- Resize mode: prefix + R (repeatable!) ---
bind R {
  set -g status-format[1] "$HINT_RESIZE"
  switch-client -T resize_mode
}
bind -T resize_mode -r h resize-pane -L 2
bind -T resize_mode -r j resize-pane -D 2
bind -T resize_mode -r k resize-pane -U 2
bind -T resize_mode -r l resize-pane -R 2
bind -T resize_mode -r H resize-pane -L 10
bind -T resize_mode -r J resize-pane -D 10
bind -T resize_mode -r K resize-pane -U 10
bind -T resize_mode -r L resize-pane -R 10
bind -T resize_mode Escape { set -g status-format[1] "$HINT_DEFAULT" }

# --- Session mode: prefix + s ---
bind s {
  set -g status-format[1] "$HINT_SESSION"
  switch-client -T session_mode
}
bind -T session_mode l { choose-session ; set -g status-format[1] "$HINT_DEFAULT" }
bind -T session_mode n { command-prompt -p "new session:" "new-session -s '%%'" ; set -g status-format[1] "$HINT_DEFAULT" }
bind -T session_mode d { detach-client ; set -g status-format[1] "$HINT_DEFAULT" }
bind -T session_mode x { kill-session ; set -g status-format[1] "$HINT_DEFAULT" }
bind -T session_mode r { command-prompt -I "#S" "rename-session '%%'" ; set -g status-format[1] "$HINT_DEFAULT" }
bind -T session_mode Escape { set -g status-format[1] "$HINT_DEFAULT" }

# =============================================================================
# Floating popups
# =============================================================================

# Floating lazygit
bind g display-popup -E -xC -yC -w 90% -h 90% -d "#{pane_current_path}" lazygit

# Session picker (sesh + fzf)
bind "T" display-popup -E -xC -yC -w 60% -h 60% \
  "sesh connect \"$(sesh list -i | fzf --ansi --no-sort --border-label ' sesh ' --prompt '> ')\""

# =============================================================================
# Quick actions (prefix + key, no mode)
# =============================================================================

bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"
bind [ copy-mode

# =============================================================================
# Plugins (via tpm)
# =============================================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'catppuccin/tmux#v2.1.3'

# Uncomment when ready:
# set -g @plugin 'omerxx/tmux-sessionx'
# set -g @plugin 'tmux-plugins/tmux-open'
# set -g @plugin 'fcsonline/tmux-thumbs'
# set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'

# --- Plugin config ---

# Session persistence
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# Yank
set -g @yank_action 'copy-pipe-and-cancel'

# Catppuccin theme
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_status_background 'default'
set -g @catppuccin_date_time_text '%H:%M'

# --- Initialize tpm (MUST be last line) ---
run '~/.tmux/plugins/tpm/tpm'

# Status line (must be AFTER tpm loads catppuccin)
set -g status-position bottom
set -g status-right-length 100
set -g status-left-length 100
set -g status-left "#{?client_prefix,#[bg=#f38ba8#,fg=#1e1e2e#,bold]  CTRL+\\  #[bg=default#,nobold] ,}"
set -g status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
