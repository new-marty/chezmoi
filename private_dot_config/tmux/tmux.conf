# =============================================================================
# tmux configuration
# =============================================================================

# --- Prefix: stock Ctrl-b ---
# The same key as a bare server's tmux. Inside a server's tmux opened from this
# one, Ctrl-b Ctrl-b sends the prefix to the inner tmux (a stock binding).

# --- Terminal (Ghostty) ---
set -g default-terminal "tmux-256color"
set -ag terminal-features ",xterm-256color:RGB"
set -ag terminal-features ",xterm-256color:extkeys"
set -g extended-keys on
set -g allow-passthrough on
set -g set-clipboard on

# --- General ---
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 100000
set -g escape-time 0
set -g focus-events on
set -g detach-on-destroy off

# --- Vi mode ---
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# =============================================================================
# Alt-based prefix-free bindings (most common actions, no prefix needed)
# =============================================================================

# Pane navigation
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Window switching
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Quick actions
bind -n M-n new-window -c "#{pane_current_path}"
bind -n M-z resize-pane -Z

# Floating scratch terminal (persistent session)
bind -n M-t display-popup -E -xC -yC -w 80% -h 80% -d "#{pane_current_path}" \
  "tmux new-session -A -s scratch"

# Popup cheatsheet
bind -n M-/ display-popup -w 80% -h 80% -E "cat ~/.config/tmux/cheatsheet.md | less -R"

# =============================================================================
# Hint bar (second status line, like Zellij)
# =============================================================================
# The second line shows the keys for whatever state the client is in: nothing
# pressed, the prefix pressed, one of the Mac-only modes, or copy mode. It
# reads #{client_key_table} and #{pane_mode}, so each client sees its own state
# and the line can never be left showing a mode that has ended.
# Stock keys (they work on any server's tmux) come first; Mac-only shortcuts are
# marked "Mac".

set -g status 2
set -g status-position bottom

# Pill styles (catppuccin mocha): K = key, A = action, M = Mac-only key,
# D = divider, T = title, G = grey. %hidden keeps these out of the environment
# of the shells tmux starts. Inside #{?...} a comma separates the branches, so the
# styles use one attribute per #[...] and a literal comma is written #,.
# Each level of #{?...} expands the text again, so a literal % is written
# %%%% in the first branch below and %%%%%%%% in the pane branch.
%hidden K="#[bg=#45475a]#[fg=#cdd6f4]#[nobold]"
%hidden A="#[bg=default]#[fg=#94e2d5]"
%hidden M="#[bg=#313244]#[fg=#f9e2af]"
%hidden D="#[bg=default]#[fg=#585b70] │ "
%hidden T="#[bg=#f9e2af]#[fg=#1e1e2e]#[bold]"
%hidden G="#[bg=default]#[fg=#6c7086]"

%hidden HINT_ROOT="#[align=centre]$K C-b $A then a key $D$K C-b ? $A all keys $D#[fg=#f9e2af]Mac #[default]$M Opt+hjkl $A pane $M Opt+1-9 $A window $M Opt+n $A new $M Opt+z $A zoom $M Opt+/ $A help "

%hidden HINT_PREFIX="#[align=centre]$T C-b #[default] $K c $A new $K n p $A next/prev $K 0-9 $A go $K #, $A rename $D$K %%%% $A split | $K \" $A split - $K o $A pane $K z $A zoom $K x $A close $D$K [ $A copy $K d $A detach $K ? $A keys "

%hidden HINT_COPY="#[align=centre]$T COPY #[default] $K hjkl $A move $K / ? $A search $K n N $A next/prev $K Space $A select $K Enter $A copy $K q $A quit $D#[fg=#f9e2af]Mac #[default]$M v $A select $M y $A copy "

%hidden HINT_PANE="#[align=centre]$T PANE: next key (Mac) #[default] $K h j k l $A move $K d $A split | $K D $A split - $K x $A close $K z $A zoom $D$G server: C-b o / C-b %%%%%%%% / C-b \" / C-b x "

%hidden HINT_WINDOW="#[align=centre]$T WINDOW: next key (Mac) #[default] $K n $A new $K h l $A prev/next $K 1-5 $A go $K r $A rename $K x $A close $D$G server: C-b c / C-b n p / C-b #, / C-b & "

%hidden HINT_RESIZE="#[align=centre]$T RESIZE: repeat (Mac) #[default] $K h j k l $A resize $K H J K L $A more $D$G server: C-b Opt+arrow "

%hidden HINT_SESSION="#[align=centre]$T SESSION: next key (Mac) #[default] $K l $A list $K n $A new $K d $A detach $K r $A rename $K x $A kill $D$G server: C-b s / C-b d / C-b \$ "

set -g status-format[1] "#{?#{==:#{client_key_table},prefix},$HINT_PREFIX,#{?#{==:#{client_key_table},pane_mode},$HINT_PANE,#{?#{==:#{client_key_table},window_mode},$HINT_WINDOW,#{?#{==:#{client_key_table},resize_mode},$HINT_RESIZE,#{?#{==:#{client_key_table},session_mode},$HINT_SESSION,#{?#{==:#{pane_mode},copy-mode},$HINT_COPY,$HINT_ROOT}}}}}}"

# =============================================================================
# Mac-only modes: prefix + P / W / R / S
# =============================================================================
# Capital letters, so the stock p w s r keep their server meaning. Each mode
# takes one key and returns (Esc cancels); resize repeats within repeat-time.

bind P switch-client -T pane_mode
bind -T pane_mode h select-pane -L
bind -T pane_mode j select-pane -D
bind -T pane_mode k select-pane -U
bind -T pane_mode l select-pane -R
bind -T pane_mode d split-window -h -c "#{pane_current_path}"
bind -T pane_mode D split-window -v -c "#{pane_current_path}"
bind -T pane_mode x kill-pane
bind -T pane_mode z resize-pane -Z
bind -T pane_mode Escape switch-client -T root

bind W switch-client -T window_mode
bind -T window_mode n new-window -c "#{pane_current_path}"
bind -T window_mode x confirm-before kill-window
bind -T window_mode r command-prompt -I "#W" "rename-window '%%'"
bind -T window_mode h previous-window
bind -T window_mode l next-window
bind -T window_mode 1 select-window -t 1
bind -T window_mode 2 select-window -t 2
bind -T window_mode 3 select-window -t 3
bind -T window_mode 4 select-window -t 4
bind -T window_mode 5 select-window -t 5
bind -T window_mode Escape switch-client -T root

# Resize repeats: keep pressing h/j/k/l within repeat-time
bind R switch-client -T resize_mode
bind -T resize_mode -r h resize-pane -L 2
bind -T resize_mode -r j resize-pane -D 2
bind -T resize_mode -r k resize-pane -U 2
bind -T resize_mode -r l resize-pane -R 2
bind -T resize_mode -r H resize-pane -L 10
bind -T resize_mode -r J resize-pane -D 10
bind -T resize_mode -r K resize-pane -U 10
bind -T resize_mode -r L resize-pane -R 10
bind -T resize_mode Escape switch-client -T root

bind S switch-client -T session_mode
bind -T session_mode l choose-session
bind -T session_mode n command-prompt -p "new session:" "new-session -s '%%'"
bind -T session_mode d detach-client
bind -T session_mode x kill-session
bind -T session_mode r command-prompt -I "#S" "rename-session '%%'"
bind -T session_mode Escape switch-client -T root

# =============================================================================
# Floating popups
# =============================================================================

# Floating lazygit
bind g display-popup -E -xC -yC -w 90% -h 90% -d "#{pane_current_path}" lazygit

# Session picker (sesh + fzf)
bind "T" display-popup -E -xC -yC -w 60% -h 60% \
  "sesh connect \"$(sesh list -i | fzf --ansi --no-sort --border-label ' sesh ' --prompt '> ')\""

# =============================================================================
# Quick actions (prefix + key, no mode)
# =============================================================================

# Reload on C-r, so the stock r (redraw the client) stays as on a server
bind C-r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# =============================================================================
# Plugins (via tpm)
# =============================================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'alexwforsythe/tmux-which-key'
set -g @plugin 'catppuccin/tmux#v2.1.3'

# Uncomment when ready:
# set -g @plugin 'omerxx/tmux-sessionx'
# set -g @plugin 'tmux-plugins/tmux-open'
# set -g @plugin 'fcsonline/tmux-thumbs'
# set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'

# --- Plugin config ---

# Session persistence
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'
set -g @resurrect-capture-pane-contents 'on'
# Restore on Opt+r, not resurrect's default C-r, which reloads this config
set -g @resurrect-restore 'M-r'
set -g @resurrect-strategy-nvim 'session'

# Yank
set -g @yank_action 'copy-pipe-and-cancel'

# Catppuccin theme
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_status_background 'default'
set -g @catppuccin_date_time_text '%H:%M'

# --- Initialize tpm (MUST be last line) ---
run '~/.tmux/plugins/tpm/tpm'

# Status line (must be AFTER tpm loads catppuccin)
set -g status-position bottom
set -g status-right-length 100
set -g status-left-length 100
set -g status-left "#{?client_prefix,#[bg=#f38ba8#,fg=#1e1e2e#,bold]  C-b  #[bg=default#,nobold] ,}"
set -g status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
