# =============================================================================
# tmux configuration
# =============================================================================

# --- Prefix: Ctrl+a ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind a send-keys C-a              # Ctrl+a, a sends literal Ctrl+a (readline)

# --- Terminal (Ghostty) ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g extended-keys on
set -g allow-passthrough on
set -g set-clipboard on

# --- General ---
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 100000
set -g escape-time 0
set -g focus-events on
set -g status-position top
set -g detach-on-destroy off      # Switch to another session on close

# --- Vi mode ---
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# --- Pane navigation ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Pane splitting ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# --- Pane resizing ---
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- New window in current path ---
bind c new-window -c "#{pane_current_path}"

# --- Window navigation (prefix-free) ---
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# --- Floating windows ---
# Floating scratch terminal (persistent session, no prefix needed)
bind -n M-t display-popup -E -xC -yC -w 80% -h 80% -d "#{pane_current_path}" \
  "tmux new-session -A -s scratch"

# Floating lazygit
bind g display-popup -E -xC -yC -w 90% -h 90% -d "#{pane_current_path}" lazygit

# Session picker (sesh + fzf)
bind "T" display-popup -E -xC -yC -w 60% -h 60% \
  "sesh connect \"$(sesh list -i | fzf --ansi --no-sort --border-label ' sesh ' --prompt '> ')\""

# Popup cheatsheet
bind -n M-? display-popup -w 80% -h 80% -E "cat ~/.config/tmux/cheatsheet.md | less -R"

# --- Reload config ---
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# --- Plugins (via tpm) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'catppuccin/tmux#v2.1.3'

# --- Plugin config ---

# Session persistence
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'
set -g @resurrect-capture-pane-contents 'on'

# Floating pane (floax)
set -g @floax-bind 'p'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-change-path 'true'

# Text hint selection (thumbs)
set -g @thumbs-key 'F'

# Catppuccin theme
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_status_background 'default'
set -g @catppuccin_status_modules_right 'session directory date_time'
set -g @catppuccin_status_modules_left ''
set -g @catppuccin_date_time_text '%H:%M'

# --- Initialize tpm (MUST be last line) ---
run '~/.tmux/plugins/tpm/tpm'
