# =============================================================================
# mise Configuration - Default Runtime Versions
# https://mise.jdx.dev/configuration.html
# =============================================================================

[settings]
# Automatically install missing tools
auto_install = true
# Use verbose output
verbose = false

[tools]
# Default versions (install with: mise install)
# Override per-project with .mise.toml or .tool-versions

# Node.js - LTS version
node = "lts"

# Python - Latest stable
python = "3.12"

# Go - Latest stable  
go = "latest"

# Rust - Latest stable (via rustup)
# rust = "latest"

# Ruby - Latest stable
# ruby = "latest"

# Deno - Latest stable
# deno = "latest"

# Bun - Latest stable
# bun = "latest"

[env]
# Global environment variables for mise-managed tools
# NODE_OPTIONS = "--max-old-space-size=4096"
